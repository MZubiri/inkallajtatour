services:
  db:
    image: mysql:8.0
    container_name: inkallajta_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: ${DB_NAME:-inkallajta_tour}
      MYSQL_USER: ${DB_USER:-inkallajta_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inkallajta_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inkallajta_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5050
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${DB_NAME:-inkallajta_tour};User=root;Password=${DB_ROOT_PASSWORD:-mysql};"
      Jwt__Key: ${JWT_KEY:-InkallajtaTour_SecretKey_2026_SuperSeguro_MinLength32Chars!}
      Jwt__Issuer: InkallajtaAPI
      Jwt__Audience: InkallajtaApp
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:5050"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inkallajta_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
